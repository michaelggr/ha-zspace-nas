container_action:
  name: 容器动作
  description: 对极空间 Docker 容器执行启动、停止或重启。
  fields:
    container_id:
      name: 容器
      description: 容器 ID、短 ID 或容器名称。
      required: true
      example: jellyfin
      selector:
        text:
    action:
      name: 动作
      required: true
      selector:
        select:
          options:
            - start
            - stop
            - restart
    entry_id:
      name: 设备标识
      description: 多台极空间时可指定，留空则按容器自动匹配。
      required: false
      selector:
        text:

dump_raw:
  name: 导出原始数据
  description: 调用一次指定能力并把原始 JSON 写到 /config/zspace_nas/，用于核对字段结构。
  fields:
    domain:
      name: 业务域
      required: true
      example: system
      selector:
        text:
    cli_action:
      name: 动作
      required: true
      example: info
      selector:
        text:
    params:
      name: 参数
      required: false
      selector:
        object:
    entry_id:
      name: 设备标识
      required: false
      selector:
        text:

container_logs:
  name: 容器日志
  description: 返回容器最近 100 行日志；save 为 true 时同时写到 /config/zspace_nas/。
  fields:
    container_id:
      name: 容器
      description: 容器 ID、短 ID 或容器名称。
      required: true
      example: qbittorrent
      selector:
        text:
    save:
      name: 同时保存到文件
      required: false
      default: false
      selector:
        boolean:
    entry_id:
      name: 设备标识
      description: 多台极空间时可指定，留空按容器自动匹配。
      required: false
      selector:
        text:

vnc_url:
  name: 虚拟机控制台链接
  description: 为指定虚拟机签一个带过期时间的控制台链接（默认 12 小时），在「查看响应」里取 url。
  fields:
    vm:
      name: 虚拟机
      description: VM 名称或标题（如 HomeAssistant）。
      required: true
      example: HomeAssistant
      selector:
        text:
    hours:
      name: 有效期（小时）
      required: false
      default: 12
      selector:
        number:
          min: 1
          max: 168
          unit_of_measurement: h
    entry_id:
      name: 设备标识
      description: 多台极空间时可指定，留空自动按虚拟机名匹配。
      required: false
      selector:
        text:
