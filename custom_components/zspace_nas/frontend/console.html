<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>虚拟机控制台 · 极空间</title>
<style>
  html, body { height: 100%; margin: 0; background: #111; color: #e6e6e6;
               font: 13px/1.4 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px;
         background: #1c1f24; border-bottom: 1px solid #2c313a; flex: none; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #9e9e9e; flex: none; }
  #dot.on { background: #26a69a; }
  #dot.err { background: #ef5350; }
  #status { flex: 1; opacity: .85; }
  button { background: #2a2f37; color: #e6e6e6; border: 1px solid #3a4049; border-radius: 6px;
           padding: 4px 10px; cursor: pointer; font-size: 12px; }
  button:hover { background: #333a44; }
  #screen { flex: 1; overflow: hidden; background: #000; }
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
          align-items: center; justify-content: center; }
  #mask.show { display: flex; }
  #box { background: #1c1f24; border: 1px solid #2c313a; border-radius: 12px;
         padding: 18px 20px; width: 280px; }
  #box h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  #box p { margin: 0 0 12px; opacity: .6; font-size: 12px; }
  #pwd { width: 100%; box-sizing: border-box; background: #12151a; color: #e6e6e6;
         border: 1px solid #3a4049; border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  #box .row { display: flex; gap: 8px; margin-top: 12px; }
  #box .row button { flex: 1; }
</style>
<script type="module" crossorigin="anonymous">
  import RFB from './novnc/core/rfb.js';

  const params = new URLSearchParams(location.search);
  const token = params.get('t') || '';
  const viewOnly = params.get('view_only') === '1';
  const statusEl = document.getElementById('status');
  const dot = document.getElementById('dot');
  const mask = document.getElementById('mask');
  const pwdInput = document.getElementById('pwd');

  let rfb = null;

  function setStatus(text, kind) {
    statusEl.textContent = text;
    dot.className = 'on' === kind ? 'on' : ('err' === kind ? 'err' : '');
  }

  function wsUrl() {
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    return scheme + '://' + location.host + '/api/zspace_nas/vncws/' + encodeURIComponent(token);
  }

  function connect() {
    if (rfb) { try { rfb.disconnect(); } catch (e) {} rfb = null; }
    setStatus('连接中…');
    try {
      rfb = new RFB(document.getElementById('screen'), wsUrl(), {});
    } catch (err) {
      setStatus('创建会话失败：' + err, 'err');
      return;
    }
    rfb.scaleViewport = true;
    rfb.resizeSession = params.get('resize') === '1';
    rfb.viewOnly = viewOnly;
    rfb.background = '#000';

    rfb.addEventListener('connect', () => { setStatus('已连接'); mask.classList.remove('show'); });
    rfb.addEventListener('disconnect', (e) => {
      const reason = e && e.detail && e.detail.clean ? '会话已结束' : '连接断开';
      setStatus(reason, 'err');
    });
    rfb.addEventListener('credentialsrequired', () => {
      setStatus('需要密码', 'err');
      mask.classList.add('show');
      pwdInput.focus();
    });
    rfb.addEventListener('securityfailure', (e) => {
      setStatus('认证失败：' + ((e && e.detail && e.detail.reason) || '密码错误'), 'err');
      mask.classList.add('show');
    });
  }

  document.getElementById('sendCad').onclick = () => { if (rfb) rfb.sendCtrlAltDel(); };
  document.getElementById('reconnect').onclick = connect;
  document.getElementById('fs').onclick = () => {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen(); }
  };
  document.getElementById('pwdOk').onclick = () => {
    if (!rfb) return;
    rfb.sendCredentials({ password: pwdInput.value });
    pwdInput.value = '';
    mask.classList.remove('show');
  };
  pwdInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('pwdOk').click(); });

  if (!token) {
    setStatus('缺少授权令牌，请从设备页的「访问」重新打开', 'err');
  } else {
    connect();
  }
</script>
</head>
<body>
  <div id="bar">
    <span id="dot"></span>
    <span id="status">初始化…</span>
    <button id="sendCad">Ctrl+Alt+Del</button>
    <button id="reconnect">重连</button>
    <button id="fs">全屏</button>
  </div>
  <div id="screen"></div>
  <div id="mask">
    <div id="box">
      <h3>需要 VNC 密码</h3>
      <p>这个虚拟机启用了 VNC 密码，输入后可连上控制台。</p>
      <input id="pwd" type="password" autocomplete="off" placeholder="VNC 密码">
      <div class="row"><button id="pwdOk">连接</button></div>
    </div>
  </div>
</body>
</html>
