title: 极空间
views:
- title: 概览
  path: overview
  icon: mdi:nas
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: 系统
      icon: mdi:chip
    - type: custom:mushroom-entity-card
      entity: sensor.zspace_cpu_usage
      name: CPU 使用率
      icon: mdi:cpu-64-bit
      icon_color: blue
      layout: vertical
      grid_options:
        columns: 6
    - type: custom:mushroom-entity-card
      entity: sensor.zspace_memory_usage
      name: 内存使用率
      icon: mdi:memory
      icon_color: teal
      layout: vertical
      grid_options:
        columns: 6
    - type: custom:mushroom-entity-card
      entity: sensor.zspace_cpu_temperature
      name: CPU 温度
      icon: mdi:thermometer
      icon_color: orange
      layout: vertical
      grid_options:
        columns: 6
    - type: custom:mushroom-entity-card
      entity: sensor.zspace_fan_speed
      name: 风扇转速
      icon: mdi:fan
      icon_color: purple
      layout: vertical
      grid_options:
        columns: 6
    - type: markdown
      content: "{% set ns = namespace(on=0, off=0, bad=0, disk=0) -%} {% for s in integration_entities('zspace_nas') | expand -%}\n  {% if s.domain == 'switch' -%}\n    {% if s.state == 'on' %}{% set ns.on = ns.on + 1 %}{% else %}{% set ns.off = ns.off + 1 %}{% endif -%}\n  {% elif s.domain == 'binary_sensor' and '健康' in s.name -%}\n    {% set ns.disk = ns.disk + 1 -%}\n    {% if s.state == 'on' %}{%\
        \ set ns.bad = ns.bad + 1 %}{% endif -%}\n  {% endif -%}\n{% endfor -%} 容器 **{{ ns.on }}** 运行 / **{{ ns.off }}** 停止 &nbsp;·&nbsp; 磁盘 **{{ ns.disk }}** 块{% if ns.bad %}，<font color=\"#ef5350\">**{{ ns.bad }}** 块异常</font>{% else %}，全部健康{% endif %}"
      grid_options:
        columns: 12
    - type: heading
      heading: 存储
      icon: mdi:harddisk
    - type: custom:bar-card
      entities:
      - entity: sensor.zspace_pool_sata11_usage
        name: sata11
        icon: mdi:harddisk
      - entity: sensor.zspace_pool_nvme12_usage
        name: nvme12
        icon: mdi:harddisk
      - entity: sensor.zspace_pool_sata13_usage
        name: sata13
        icon: mdi:harddisk
      max: 100
      min: 0
      height: 20
      rounded: true
      columns: 1
      unit_of_measurement: '%'
      severity:
      - color: '#26a69a'
        from: 0
        to: 70
      - color: '#ffb74d'
        from: 70
        to: 85
      - color: '#ef5350'
        from: 85
        to: 100
      positions:
        icon: 'off'
        indicator: inside
        name: outside
        value: outside
      grid_options:
        columns: 12
    - type: markdown
      content: |-
        {% set pools = [
          ('sata11', 'sensor.zspace_pool_sata11_usage'),
          ('nvme12', 'sensor.zspace_pool_nvme12_usage'),
          ('sata13', 'sensor.zspace_pool_sata13_usage'),
        ] -%}
        | 池 | 槽位 | 型号 | 容量 | 温度 | 通电 | 健康 |
        |:--|:--:|:--|--:|--:|--:|:--:|
        {% for name, eid in pools -%}
        {% for d in state_attr(eid, 'disks') or [] -%}
        {% set size = ((d.total / 1099511627776) | round(2)) if d.total else '—' -%}
        {% set temp = ((d.temperature | round(0) | int) ~ '℃') if d.temperature is not none else '—' -%}
        {% set health = '✅' if d.health in ['ok', 'good', 'normal', none] else ('⚠️ ' ~ d.health) -%}
        | {{ name }} | {{ d.pos or '—' }} | {{ d.model or '—' }} | {{ size }} TB | {{ temp }} | {{ d.power_on_hours or '—' }} h | {{ health }} |
        {% endfor -%}
        {% endfor -%}
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: 网络
      icon: mdi:swap-vertical
    - type: custom:apexcharts-card
      graph_span: 6h
      update_interval: 1min
      header:
        title: 吞吐（MB/s）
        show: true
        show_states: true
        colorize_states: true
      series:
      - entity: sensor.zspace_network_rx
        name: 下行
        type: area
        curve: smooth
        stroke_width: 2
        transform: return Number(x) / 1048576;
        unit: MB/s
        color: '#42a5f5'
      - entity: sensor.zspace_network_tx
        name: 上行
        type: area
        curve: smooth
        stroke_width: 2
        transform: return Number(x) / 1048576;
        unit: MB/s
        color: '#ab47bc'
      yaxis:
      - decimals: 1
        apex_config:
          tickAmount: 4
      apex_config:
        chart:
          height: 180
        legend:
          show: true
          position: top
        grid:
          strokeDashArray: 3
      grid_options:
        columns: 12
    - type: heading
      heading: 下载
      icon: mdi:download
    - type: entities
      entities:
      - entity: sensor.zspace_downloads_active
        name: 进行中
        icon: mdi:progress-download
      - entity: sensor.zspace_downloads_seeding
        name: 做种
        icon: mdi:seed
      - entity: sensor.zspace_downloads_rate
        name: 下载速度
        icon: mdi:speedometer
      grid_options:
        columns: 12
- title: 容器
  path: containers
  icon: mdi:docker
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: 运行中
      icon: mdi:play-circle
    - type: custom:auto-entities
      card:
        type: grid
        columns: 3
        square: false
      card_param: cards
      filter:
        include:
        - domain: switch
          integration: zspace_nas
          state: 'on'
          options:
            type: custom:mushroom-entity-card
            layout: vertical
            icon_color: green
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      sort:
        method: name
        ignore_case: true
  - type: grid
    cards:
    - type: heading
      heading: 已停止
      icon: mdi:stop-circle
    - type: custom:auto-entities
      card:
        type: grid
        columns: 3
        square: false
      card_param: cards
      filter:
        include:
        - domain: switch
          integration: zspace_nas
          state: 'off'
          options:
            type: custom:mushroom-entity-card
            layout: vertical
            icon_color: disabled
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      sort:
        method: name
        ignore_case: true
- title: 趋势
  path: trends
  icon: mdi:chart-timeline-variant
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: custom:apexcharts-card
      graph_span: 24h
      header:
        title: CPU 与内存
        show: true
        show_states: true
        colorize_states: true
      series:
      - entity: sensor.zspace_cpu_usage
        name: CPU
        type: line
        curve: smooth
        stroke_width: 2
        color: '#42a5f5'
      - entity: sensor.zspace_memory_usage
        name: 内存
        type: line
        curve: smooth
        stroke_width: 2
        color: '#26a69a'
      yaxis:
      - decimals: 1
        min: 0
        apex_config:
          tickAmount: 5
      apex_config:
        chart:
          height: 230
        legend:
          show: false
        grid:
          strokeDashArray: 3
    - type: custom:apexcharts-card
      graph_span: 24h
      header:
        title: 存储池使用率
        show: true
        show_states: true
        colorize_states: true
      series:
      - entity: sensor.zspace_pool_sata11_usage
        name: sata11
        type: line
        curve: smooth
        stroke_width: 2
        color: '#42a5f5'
      - entity: sensor.zspace_pool_nvme12_usage
        name: nvme12
        type: line
        curve: smooth
        stroke_width: 2
        color: '#26a69a'
      - entity: sensor.zspace_pool_sata13_usage
        name: sata13
        type: line
        curve: smooth
        stroke_width: 2
        color: '#ab47bc'
      yaxis:
      - decimals: 1
        min: 0
        max: 100
        apex_config:
          tickAmount: 5
      apex_config:
        chart:
          height: 230
        legend:
          show: false
        grid:
          strokeDashArray: 3
  - type: grid
    cards:
    - type: custom:auto-entities
      card:
        type: entities
        state_color: true
        title: 磁盘温度（当前）
      filter:
        include:
        - domain: sensor
          integration: zspace_nas
          name: '*磁盘*温度*'
      sort:
        method: name
        ignore_case: true
      grid_options:
        columns: 12
    - type: markdown
      content: >-
        温度曲线请在「开发者工具 → 状态」里搜 `disk` 找到对应实体的「查看历史记录」。
        短英文 ID 下磁盘实体用硬盘序列号命名，无法在面板里写死。
      grid_options:
        columns: 12
    - type: custom:apexcharts-card
      graph_span: 24h
      header:
        title: 网络吞吐
        show: true
        show_states: true
        colorize_states: true
      series:
      - entity: sensor.zspace_network_rx
        name: 下行
        type: area
        curve: smooth
        stroke_width: 2
        transform: return Number(x) / 1048576;
        unit: MB/s
        color: '#42a5f5'
      - entity: sensor.zspace_network_tx
        name: 上行
        type: area
        curve: smooth
        stroke_width: 2
        transform: return Number(x) / 1048576;
        unit: MB/s
        color: '#ab47bc'
      yaxis:
      - decimals: 1
        apex_config:
          tickAmount: 4
      apex_config:
        chart:
          height: 230
        legend:
          show: false
        grid:
          strokeDashArray: 3
- title: 虚拟机
  path: vms
  icon: mdi:desktop-tower-monitor
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: 虚拟机
      icon: mdi:desktop-tower-monitor
    - type: custom:auto-entities
      card:
        type: entities
        state_color: true
        title: 运行状态
      filter:
        # VM 运行态实体的 friendly_name 只有「运行中」（机器名当设备名），
        # 不含「虚拟机」三字，不能用 name 匹配。用 VM 独有属性 vm_name 匹配：
        # 短 ID / 拼音 ID 都覆盖，且每个实体只匹配一次（多个 include 是并集会重复）。
        include:
        - domain: binary_sensor
          integration: zspace_nas
          attributes:
            vm_name: '*'
      sort:
        method: name
        ignore_case: true
      grid_options:
        columns: 12
    - type: markdown
      content: >-
        **打开控制台**：到「设置 → 设备与服务 → 极空间 Z4Pro → 对应虚拟机」，
        点右上角**「访问」**即可打开 noVNC 控制台（链接每 6 小时自动续签，不会失效）。

        虚拟机须在极空间里已开启 VNC，且集成选项勾选了「虚拟机控制台」。
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: 资源占用
      icon: mdi:gauge
    - type: custom:auto-entities
      card:
        type: entities
        state_color: true
        title: CPU / 内存 / 磁盘
      filter:
        include:
        - domain: sensor
          integration: zspace_nas
          name: '*使用率*'
      sort:
        method: name
        ignore_case: true
      grid_options:
        columns: 12
- title: 全部实体
  path: all
  icon: mdi:format-list-bulleted
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: 传感器
      icon: mdi:gauge
    - type: custom:auto-entities
      card:
        type: entities
        state_color: true
      filter:
        include:
        - domain: sensor
          integration: zspace_nas
      sort:
        method: name
        ignore_case: true
    - type: heading
      heading: 二进制传感器
      icon: mdi:toggle-switch
    - type: custom:auto-entities
      card:
        type: entities
        state_color: true
      filter:
        include:
        - domain: binary_sensor
          integration: zspace_nas
      sort:
        method: name
        ignore_case: true
  - type: grid
    cards:
    - type: heading
      heading: 容器开关
      icon: mdi:docker
    - type: custom:auto-entities
      card:
        type: entities
        state_color: true
      filter:
        include:
        - domain: switch
          integration: zspace_nas
      sort:
        method: name
        ignore_case: true
